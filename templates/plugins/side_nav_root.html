{% for item in nav_items %}
<li{% if forloop.first %} class="first"{% elif forloop.last %} class="last"{% elif item.children %} class="li-has-children{% if item.active %} active{% endif %}"{% elif item.active %} class="active"{% endif %}>
  <a href="{{ item.page.get_absolute_url }}"{% if item.current %} class="current" aria-current="page"{% endif %}>{{ item.page.get_page_title }}</a>
  {% if item.children %}
  <ul class="nav-level-2 depth_2">
    {% for child in item.children %}
    <li{% if forloop.first %} class="first"{% elif forloop.last %} class="last"{% elif child.active %} class="active"{% endif %}>
      <a href="{{ child.page.get_absolute_url }}"{% if child.current %} class="current" aria-current="page"{% endif %}>{{ child.page.get_page_title }}</a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</li>
{% empty %}
{# No top-level in-navigation pages under the site home. #}
{% endfor %}
