{% for item in nav_items %}
<li class="{% if forloop.first %}first{% endif %}{% if forloop.last %} last{% endif %}{% if item.children %} li-has-children{% endif %}{% if item.active %} active{% endif %}">
  <a href="{{ item.page.get_absolute_url }}"{% if item.current %} class="current" aria-current="page"{% endif %}>{{ item.page.get_page_title }}</a>
  {% if item.children %}
  <ul class="nav-level-2 depth_2">
    {% for child in item.children %}
    <li class="{% if forloop.first %}first{% endif %}{% if forloop.last %} last{% endif %}{% if child.active %} active{% endif %}">
      <a href="{{ child.page.get_absolute_url }}"{% if child.current %} class="current" aria-current="page"{% endif %}>{{ child.page.get_page_title }}</a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</li>
{% empty %}
{# No top-level pages under the site home. #}
{% endfor %}
