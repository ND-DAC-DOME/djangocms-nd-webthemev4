volumes:
  djangocms_ndthemev4_local_postgres_data: {}
  djangocms_ndthemev4_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: djangocms_ndthemev4_local_django
    container_name: djangocms_ndthemev4_local_django
    depends_on:
      - postgres
      - mailhog
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start
    networks:
      - backend
      - frontend

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: djangocms_ndthemev4_local_postgres
    container_name: djangocms_ndthemev4_local_postgres
    ports:
      - "5432:5432"
    volumes:
      - djangocms_ndthemev4_local_postgres_data:/var/lib/postgresql/data
      - djangocms_ndthemev4_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    networks:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.0
    container_name: djangocms_ndthemev4_local_mailhog
    ports:
      - "8025:8025"
    networks:
      - backend
      - frontend

  redis:
    image: redis:alpine
    container_name: djangocms_ndthemev4_local_redis
    networks:
      - backend

  celeryworker:
    <<: *django
    image: djangocms_ndthemev4_local_celeryworker
    container_name: djangocms_ndthemev4_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: celery -A config.celery_app worker -l info -Q celery
    networks:
      - backend

  celerybeat:
    <<: *django
    image: djangocms_ndthemev4_local_celerybeat
    container_name: djangocms_ndthemev4_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat
    networks:
      - backend

networks:
  frontend:
  backend:
